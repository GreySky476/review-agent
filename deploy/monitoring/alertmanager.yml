# =============================================================================
# Alertmanager Configuration — review-agent
# =============================================================================
# Simple routing: all alerts go to the default webhook receiver.
# Replace the placeholder URL with your actual notification endpoint
# (Slack, PagerDuty, Opsgenie, or a custom webhook).
# =============================================================================

global:
  resolve_timeout: 5m

# -----------------------------------------------------------------------------
# Routing tree
# -----------------------------------------------------------------------------
route:
  receiver: default-receiver
  group_by:
    - alertname
    - severity
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h

# -----------------------------------------------------------------------------
# Inhibition rules
# -----------------------------------------------------------------------------
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal:
      - alertname

# -----------------------------------------------------------------------------
# Receivers
# -----------------------------------------------------------------------------
receivers:
  - name: default-receiver
    webhook_configs:
      - url: "https://hooks.example.com/alerts"
        send_resolved: true
