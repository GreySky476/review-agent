# =============================================================================
# review-agent — Secret (sensitive credentials — placeholders)
# =============================================================================
# Replace these placeholder values with real credentials before deploying.
# Do NOT commit real secrets to version control.
# Use a secrets manager (Vault, Sealed Secrets, External Secrets Operator) in production.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: review-agent
  labels:
    app: review-agent
    component: config
type: Opaque
stringData:
  # JWT signing secret — generate with: openssl rand -hex 32
  REVIEW_AGENT_JWT_SECRET: "PLACEHOLDER-CHANGE-ME"

  # GitHub personal access token (needs repo and pull_request scopes)
  REVIEW_AGENT_GITHUB_TOKEN: "PLACEHOLDER-CHANGE-ME"

  # AI provider API key (DeepSeek / OpenAI)
  REVIEW_AGENT_AI_API_KEY: "PLACEHOLDER-CHANGE-ME"
