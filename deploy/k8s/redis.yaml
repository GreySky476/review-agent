# =============================================================================
# review-agent — Redis 7 StatefulSet + Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: review-agent
  labels:
    app: review-agent
    component: cache
spec:
  type: ClusterIP
  clusterIP: None  # headless service for StatefulSet
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: review-agent
    component: cache
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: review-agent
  labels:
    app: review-agent
    component: cache
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: review-agent
      component: cache
  template:
    metadata:
      labels:
        app: review-agent
        component: cache
    spec:
      containers:
        - name: redis
          image: "redis:7-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              protocol: TCP
              name: redis
          env:
            - name: REDIS_PASSWORD
              value: ""
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
        labels:
          app: review-agent
          component: cache
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "1Gi"
