# =============================================================================
# review-agent — API Deployment + Service + HPA + Ingress
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: review-agent
  labels:
    app: review-agent
    component: api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: review-agent
    component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: review-agent
  labels:
    app: review-agent
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: review-agent
      component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: review-agent
        component: api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: "review-agent:latest"
          imagePullPolicy: IfNotPresent
          command:
            - "python"
            - "-m"
            - "uvicorn"
            - "review_agent.api.app:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          ports:
            - containerPort: 8000
              protocol: TCP
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: "/healthz"
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: "/healthz"
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: review-agent
  labels:
    app: review-agent
    component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: review-agent
  labels:
    app: review-agent
    component: api
spec:
  rules:
    - host: "review-agent.example.com"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
