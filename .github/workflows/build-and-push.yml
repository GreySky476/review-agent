# =============================================================================
# review-agent CI — Docker 镜像构建与推送流水线
# =============================================================================
# 触发器: push → main (Dockerfile/src 变更时) / tag v*.*.* / workflow_dispatch
# 任务:   多架构构建 → 推送到 ghcr.io → Trivy 安全扫描
# =============================================================================

name: Build and Push

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'src/**'
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # -- 多架构支持 -----------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -- 镜像仓库认证 ---------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -- 构建并推送 -----------------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/review-agent:latest
            ghcr.io/${{ github.repository }}/review-agent:${{ github.sha }}
            ghcr.io/${{ github.repository }}/review-agent:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -- 安全扫描 (仅 HIGH/CRITICAL) ------------------------------------------
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/review-agent:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
